# OAK Configuration for site-kb term validation
# Maps ontology prefixes to OAK adapter strings
#
# Adapter types:
#   sqlite:obo:<name>  - Pre-built SQLite databases (fast, offline, recommended)
#   ols:               - Ontology Lookup Service (EBI, online)
#   ""                 - Skip validation for this prefix

ontology_adapters:
  # Environment ontology (ecosystems, biomes, habitats)
  ENVO: simpleobo:cache/ontologies/envo.obo

  # Biome, Environment, and Research Variable Ontology
  BERVO: sqlite:obo:bervo

  # Ontology for Biomedical Investigations (instruments, assays)
  OBI: sqlite:obo:obi

  # Units of measurement
  UO: sqlite:obo:uo

  # Gazetteer (geographic regions)
  GAZ: sqlite:obo:gaz

  # Taxonomy
  NCBITaxon: sqlite:obo:ncbitaxon

  # MIxS terms
  MIXS: simpleobo:cache/ontologies/mixs-labels.obo

  # SKOS relation meanings used by crosswalk enums
  skos: simpleobo:cache/ontologies/skos-labels.obo

  # Phenotype and Trait Ontology
  PATO: sqlite:obo:pato

  # Information Artifact Ontology
  IAO: sqlite:obo:iao

  # Skip validation for these common prefixes
  linkml: ""
  schema: ""
  dcterms: ""
  xsd: ""
  rdf: ""
  rdfs: ""
  owl: ""
  orcid: ""
  ror: ""
  doi: ""
  deims: ""
