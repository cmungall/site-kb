variable_definitions:
- id: site_kb:variable-mixs-0001107
  name: samp_name
  term:
    id: MIXS:0001107
    label: samp_name
  source_variables:
  - source: MIxS
    source_id: MIXS:0001107
    source_name: samp_name
    record_url: https://github.com/GenomicsStandardsConsortium/mixs/blob/0bc3c221b4a368ed7939d9a1fe4cbd8f407a221b/src/mixs/schema/mixs.yaml
  description: A local identifier or name that for the material sample used for extracting
    nucleic acids, and subsequent sequencing. It can refer either to the original
    material collected or to any derived sub-samples. It can have any format, but
    we suggest that you make it concise, unique and consistent within your lab, and
    as informative as possible. INSDC requires every sample name from a single Submitter
    to be unique. Use of a globally unique identifier for the field source_mat_id
    is recommended in addition to sample_name
