- id: site_kb:wwtp-dachang-nanjing
  name: Dachang wastewater treatment plant
  site_type:
    id: ENVO:00002043
    label: wastewater treatment plant
  location:
    country: China
    state_province: Jiangsu
  variables:
  - variable_id: site_kb:variable-antiviral-defense-abundance
    evidence:
    - https://doi.org/10.1093/ismejo/wraf051
    method: DefenseFinder complete-system detection; CoverM with BWA-MEM contig abundance
    sample_context: Aerobic-tank activated sludge; WWTP-DC
    sampling_period: January 2013 to September 2018
    reported_units: RPKM
  - variable_id: site_kb:variable-crispr-spacer-density
    evidence:
    - https://doi.org/10.1093/ismejo/wraf051
    method: CRISPR spacer extraction from metagenomic reads and sequence analysis
    sample_context: Aerobic-tank activated sludge; WWTP-DC
    sampling_period: January 2013 to September 2018
  datasets:
  - title: Long-term metagenomic insights into the roles of antiviral defense systems
      in stabilizing activated sludge bacterial communities
    url: https://www.ebi.ac.uk/ena/browser/view/PRJNA1149857
    accession: PRJNA1149857
    assay: Shotgun metagenomics
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1093/ismejo/wraf051
    notes: 134 public metagenomic runs across both Nanjing plants. Article reports
      69 Dachang and 65 Jiangxinzhou datasets; four Jiangxinzhou samples failed quality
