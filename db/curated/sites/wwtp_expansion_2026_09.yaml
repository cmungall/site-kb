sites:
- id: site_kb:wwtp-sha-tin
  name: Sha Tin Sewage Treatment Works
  site_type:
    id: ENVO:00002043
    label: wastewater treatment plant
  location:
    country: China
    state_province: Hong Kong
    latitude: 22.407
    longitude: 114.214
  variables:
  - variable_id: site_kb:variable-bacterial-16s-profile
    evidence:
    - https://doi.org/10.1128/msystems.01333-23
    method: 16S rRNA amplicon sequencing and OTU analysis
    sample_context: Influent, activated sludge and final-sedimentation-tank effluent;
      study site code ST
    sampling_period: January 2018 to January 2019
  - variable_id: site_kb:variable-wwtp-temperature
    evidence:
    - https://doi.org/10.1128/msystems.01333-23
    method: Operational records supplied by the Hong Kong Drainage Services Department;
      study RDA analysis
    sample_context: Plant operational covariates; study site code ST
    sampling_period: January 2018 to January 2019
  - variable_id: site_kb:variable-mean-cell-residence-time
    evidence:
    - https://doi.org/10.1128/msystems.01333-23
    method: Operational records supplied by the Hong Kong Drainage Services Department;
      study RDA analysis
    sample_context: Plant operational covariates; study site code ST
    sampling_period: January 2018 to January 2019
  - variable_id: site_kb:variable-hydraulic-retention-time
    evidence:
    - https://doi.org/10.1128/msystems.01333-23
    method: Operational records supplied by the Hong Kong Drainage Services Department;
      study RDA analysis
    sample_context: Plant operational covariates; study site code ST
    sampling_period: January 2018 to January 2019
  - variable_id: site_kb:variable-eukaryotic-relative-abundance
    evidence:
    - https://doi.org/10.1093/ismejo/wraf058
    method: Metagenomic contig classification and CoverM read mapping
    sample_context: Aerobic activated sludge; study site code ST
    sampling_period: June 2007 to December 2019
  - variable_id: site_kb:variable-arg-per-million-bases
    evidence:
    - https://doi.org/10.1186/s40168-019-0663-0
    method: Nanopore and Illumina sequence analysis
    sample_context: Influent, activated sludge and effluent; code ST
    reported_units: ARG number per million base pairs
  - variable_id: site_kb:variable-arg-genetic-context
    evidence:
    - https://doi.org/10.1186/s40168-019-0663-0
    method: Nanopore and Illumina sequence analysis
    sample_context: Influent, activated sludge and effluent; code ST
  - variable_id: site_kb:variable-eukaryotic-rna-dna-ratio
    evidence:
    - https://doi.org/10.1093/ismejo/wraf058
    method: Metatranscriptomic read filtering with SortMeRNA and CoverM mapping relative
      to DNA abundance
    sample_context: Twelve Sha Tin activated-sludge RNA samples
    sampling_period: April 2017 to March 2018
  datasets:
  - title: Effects of operational parameters on bacterial communities in Hong Kong
      and global wastewater treatment plants
    url: https://www.ebi.ac.uk/ena/browser/view/PRJNA1012295
    accession: PRJNA1012295
    assay: 16S rRNA amplicon sequencing
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1128/msystems.01333-23
    notes: 222 public amplicon runs across six plants; this is not a shotgun sequencing
      dataset. Site/sample mapping is retained in the accession metadata snapshot.
  - title: Longitudinal dynamics and cross-domain interactions of eukaryotic populations
      in wastewater treatment plants
    url: https://www.ebi.ac.uk/ena/browser/view/PRJNA432264
    accession: PRJNA432264
    assay: Shotgun metagenomics
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1093/ismejo/wraf058
    notes: Project reused and extended across publications. Article reports 143 longitudinal
      Sha Tin samples, one-year series at Stanley and Shek Wu Hui, and one activated-sludge
      sample each from Tai Po, Yuen Long and Sai Kung. Current ENA run counts do not
      resolve the full published sample inventory; do not assign every project run
      to each plant.
  - title: Mobile antibiotic resistome in wastewater treatment plants revealed by
      Nanopore metagenomic sequencing
    url: https://www.ebi.ac.uk/ena/browser/view/PRJNA505617
    accession: PRJNA505617
    assay: Illumina shotgun metagenomics; associated Nanopore metagenomics reported
      in the article
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1186/s40168-019-0663-0
    notes: PRJNA505617 currently returns Illumina runs, including repeated BioSamples
      and an influent mixed-culture library. Article separately cites SAMN09603371–SAMN09603381
      for the Nanopore-associated data. Project totals are not independent environmental-sample
      counts.
  - title: Sha Tin metatranscriptomes used in the eukaryote study
    url: https://doi.org/10.1093/ismejo/wraf058
    assay: Metatranscriptomics
    availability: UNRESOLVED
    evidence:
    - https://doi.org/10.1093/ismejo/wraf058
    notes: Study reports twelve RNA samples. Its cited project PRJNA432264 currently
      returns only WGS-labelled runs in ENA; RNA run accessions have not been independently
      resolved.
  aliases:
  - ST
  - Shatin WWTP
  - Sha Tin WWTP
  description: Hong Kong secondary sewage treatment works studied for microbial community
    composition and its association with operating conditions.
  notes: Study-specific observations do not assert uninterrupted monitoring or current
    operating conditions. Coordinates from Che et al. 2019 sampling methods. Sha Tin
    and Tai Po are described as treating saline sewage associated with seawater toilet
    flushing. Shared project accessions must be filtered by site/sample; publications
    can reuse the same reads.
