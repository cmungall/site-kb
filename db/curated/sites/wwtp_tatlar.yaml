sites:
- id: site_kb:wwtp-tatlar
  name: Tatlar Wastewater Treatment Plant
  aliases:
  - Ankara Tatlar WWTP
  site_type:
    id: ENVO:00002043
    label: wastewater treatment plant
  location:
    country: Türkiye
    state_province: Ankara
  description: Ankara wastewater plant explicitly named in ENA BioSample SAMEA4527663,
    associated with shotgun sewage metagenomes reanalysed in the 2026 Türkiye resistome
    study.
  datasets:
  - title: Tatlar sewage metagenome sequencing
    url: https://www.ebi.ac.uk/ena/browser/view/SAMEA4527663
    accession: SAMEA4527663
    assay: Shotgun metagenomics (WGS)
    availability: PUBLIC
    evidence:
    - https://www.ebi.ac.uk/ena/browser/view/SAMEA4527663
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC13509523/
    notes: PRJEB13831 runs ERR2592273, ERR1713395 and ERR1726009 all refer to this
      same BioSample. Do not count these runs as independent biological samples.
  variables:
  - variable_id: site_kb:variable-arg-presence
    evidence:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC13509523/
    - https://www.ebi.ac.uk/ena/browser/view/SAMEA4527663
    method: DeepARG analysis of assembled genomes; presence/absence profiling
    sample_context: Sewage metagenome runs ERR2592273, ERR1713395 and ERR1726009;
      one shared BioSample.
    sampling_period: 2016-02-03 according to ENA and Table S1.
  - variable_id: site_kb:variable-taxonomic-profile
    evidence:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC13509523/
    - https://www.ebi.ac.uk/ena/browser/view/SAMEA4527663
    method: Kraken2 and Bracken metagenomic profiling
    sample_context: Sewage metagenome runs ERR2592273, ERR1713395 and ERR1726009;
      one shared BioSample.
    sampling_period: 2016-02-03 according to ENA and Table S1.
  notes: Facility name is explicitly reported by https://www.ebi.ac.uk/ena/browser/view/SAMEA4527663.
    Coordinates omitted because the named sample gives 39.9334 N, 32.8597 E whereas
    other Ankara samples in the paper give 39.8983889 N, 32.4536389 E; these records
    have not been reconciled. The other three Ankara runs in PRJEB27054 are retained
    as unresolved links, not automatically assigned here. Hatay records remain research
    leads. Aggregate ARG/MAG counts from the ten-run paper are not assigned to Tatlar.
