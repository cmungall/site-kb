  description: The typical vegetation of the forest is natural conifer-broadleaved
    mixed forest, dominated by Betula ermanii, Abies sachalinensis, Picea glehnii,
    Quercus crispula, and Acer mono, with dwarf bamboo species in the understory.
    The mean annual temperature is 5.4 ºC and the mean annual precipitation is 1,449
    mm.
