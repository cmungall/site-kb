    name: Luancheng Agricultural Ecological Station - China
  description: "Luancheng station, established in 1981, is one of the field stations\
    \ of the Chinese Ecosystem Research Network (CERN) and a member of Global Terrestrial\
    \ Observation System (GTOS). The station is also a demonstration base for modern\
    \ agricultural technologies in Hebei province. In 2005, the station became one\
    \ of the stations of the China National Ecosystem Observation and Research Network（CNERN）.\r\
    \n    Luancheng Station is located in Luancheng county of Hebei province (37°53'\
    \ N, 114°41'E and elevation at 50.1 m), represents the typical high production\
    \ area in the northern part of the North China Plain. The rapid declining groundwater\
    \ table has become the main problem that threatens the sustainable agricultural\
    \ development in this area.\r\n    The researches conducted at the station focus\
    \ on the long-term investigations of farmland ecosystem, water and nutrients transfer\
    \ and regulation mechanisms, modern water-saving technologies, molecular breeding,\
    \ precision agriculture and regional sustainable agro-ecosystem demonstration\
    \ models etc.. The station has 28 ha land for field research and provides accommodation\
    \ for scientists and students to stay. There are laboratories, field research\
    \ infrastructure and equipments to be used for different experiments."
  notes: 'DEIMS country: China; DEIMS average elevation: 50.1 m'
  status: ACTIVE
