    name: Shenyang Experimental Station of Ecology - China
  description: 'The Shenyang experimental station of ecology is located at Shilihe
    village of Sujiatun district, 35 km from southern Shenyang. The Station was founded
    in 1987, and it was authorized by the Chinese Academy of Science as a key station
    of CERN in 1992, and then as one of the open stations for field research in 1997.
    Moreover, it became a National field research station in agro-ecosystem research
    in 2005. '
