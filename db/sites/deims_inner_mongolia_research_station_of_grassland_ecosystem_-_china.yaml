    name: Inner Mongolia Research Station of Grassland Ecosystem - China
  description: The Inner Mongolia Grassland Ecosystem Station (IMGERS) of the Chinese
    Academy of Sciences is located in the Xilin River Basin, Inner Mongolia. It was
    established in 1979. This area is characterized by a typical temperate semiarid
    climate with a mean annual (1982-2012) precipitation of 297 mm and a mean annual
    temperature of 0.9°C. Growing season usually runs from late April to late September.
    The soil in this site is chestnut soil with relatively homogeneous physiochemical
    properties.
  notes: 'DEIMS country: China'
