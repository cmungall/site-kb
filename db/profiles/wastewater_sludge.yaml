    variable_id: site_kb:variable-mixs-0000689
  - source_slot: wastewater_type
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000353
  applicability_scope: FACILITY
