    source_required: false
    source_multivalued: false
    source_preferred_unit: micromole per liter
    variable_id: site_kb:variable-mixs-0000505
  - source_slot: pre_treatment
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000348
  - source_slot: primary_treatment
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000349
  - source_slot: reactor_type
