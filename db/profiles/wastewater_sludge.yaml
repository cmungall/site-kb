    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000350
  - source_slot: salinity
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: practical salinity unit, percentage
    variable_id: site_kb:variable-mixs-0000183
  - source_slot: samp_store_dur
    category: sample or study context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000116
  - source_slot: samp_store_loc
    category: sample or study context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000755
  - source_slot: samp_store_temp
    category: sample or study context
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: degree Celsius
    variable_id: site_kb:variable-mixs-0000110
  - source_slot: samp_vol_we_dna_ext
    category: sample or study context
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: milliliter, gram, milligram, square centimeter
    variable_id: site_kb:variable-mixs-0000111
  - source_slot: secondary_treatment
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000351
  - source_slot: sewage_type
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000215
  - source_slot: sludge_retent_time
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: hours
    variable_id: site_kb:variable-mixs-0000669
  - source_slot: sodium
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: milligram per liter, parts per million
    variable_id: site_kb:variable-mixs-0000428
  - source_slot: soluble_inorg_mat
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: true
    source_preferred_unit: gram, microgram, mole per liter, gram per liter, parts
      per million
    variable_id: site_kb:variable-mixs-0000672
  - source_slot: soluble_org_mat
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: true
    source_preferred_unit: gram, microgram, mole per liter, gram per liter, parts
      per million
    variable_id: site_kb:variable-mixs-0000673
  - source_slot: suspend_solids
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: true
    source_preferred_unit: gram, microgram, milligram per liter, mole per liter, gram
      per liter, part per million
    variable_id: site_kb:variable-mixs-0000150
  - source_slot: temp
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: degree Celsius
    variable_id: site_kb:variable-mixs-0000113
  - source_slot: tertiary_treatment
    category: process or facility context
    source_range: string
    source_required: false
    source_multivalued: false
    variable_id: site_kb:variable-mixs-0000352
  - source_slot: tot_nitro
    category: measurement
    source_range: string
    source_required: false
    source_multivalued: false
    source_preferred_unit: microgram per liter, micromole per liter, milligram per
      liter
    variable_id: site_kb:variable-mixs-0000102
  - source_slot: tot_phosphate
    category: measurement
    source_range: string
